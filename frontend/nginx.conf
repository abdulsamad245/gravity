# Gravity frontend: static SPA + reverse proxy to the backend service.
server {
    listen 80;
    server_name _;

    # Board image/audio uploads are JSON data URLs (up to ~3mb on the API).
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hygiene. No X-Frame-Options: boards support ?embed=1.
    # Client storage (session/local/IndexedDB) stays app-readable by design; XSS
    # defense is the real control — keep API keys server-side, not in VITE_*.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    # PWA: always revalidate the service worker and web manifest.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback: /rooms/abc123 (shareable invite links) must load index.html,
    # letting the client-side router render the room.
    location / {
        try_files $uri /index.html;
    }

    # Orbit SSE stream — disable buffering so tokens reach the browser live.
    location = /api/v1/orbit/chat/stream {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # REST API (health, replay log, Swagger) -> backend service.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Yjs realtime sync. The Upgrade/Connection headers are required for
    # WebSockets to pass through a proxy.
    location /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
